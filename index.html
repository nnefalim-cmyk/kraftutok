<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRAFT UTÓK — магазин одежды</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --c1: #ff1a1a; --c2: #8b0000; --bg1: #000; --bg2: #0a0000; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: var(--bg1); color: #fff; min-height: 100vh; }
  .header { padding: 16px; border-bottom: 2px solid var(--c1); text-align: center; font-size: 24px; font-weight: 900; text-transform: uppercase; }
  .header span { color: var(--c1); font-style: italic; }
  .container { max-width: 800px; margin: 0 auto; padding: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
  .card { background: #111; border: 1px solid #333; border-radius: 10px; padding: 15px; text-align: center; }
  .card h3 { font-size: 16px; margin-bottom: 5px; }
  .card .price { color: var(--c1); font-weight: 800; font-size: 18px; margin: 10px 0; }
  .btn { display: block; width: 100%; padding: 12px; background: var(--c1); color: #000; border: none; border-radius: 8px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-top: 10px; }
  .btn:active { background: #fff; }
  .btn-outline { background: transparent; border: 1px solid var(--c1); color: var(--c1); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; padding: 15px; z-index: 100; }
  .modal-overlay.show { display: flex; }
  .modal { background: #111; border: 1px solid var(--c1); border-radius: 12px; width: 100%; max-width: 400px; padding: 20px; position: relative; max-height: 90vh; overflow-y: auto; }
  .modal-close { position: absolute; top: 10px; right: 15px; font-size: 24px; color: var(--c1); cursor: pointer; background: none; border: none; }
  label { display: block; margin-top: 15px; font-size: 12px; color: #aaa; text-transform: uppercase; font-weight: 700; }
  input { width: 100%; padding: 12px; margin-top: 5px; background: #000; border: 1px solid #333; color: #fff; border-radius: 6px; }
  .cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; border-bottom: 1px solid #222; padding-bottom: 5px; }
  .total { font-size: 20px; font-weight: 900; color: var(--c1); margin: 15px 0; text-align: right; }
</style>
</head>
<body>
<div class="header">KRAFT <span>UTÓK</span></div>

<div class="container">
  <h2 style="text-align:center; margin-bottom:20px;">Каталог</h2>
  <div class="grid">
    <div class="card">
      <h3>Футболка Oversize</h3>
      <div class="price">1 990 ₽</div>
      <button class="btn" onclick="addToCart('Футболка Oversize', 1990)">В корзину</button>
    </div>
    <div class="card">
      <h3>Худи с начёсом</h3>
      <div class="price">3 990 ₽</div>
      <button class="btn" onclick="addToCart('Худи', 3990)">В корзину</button>
    </div>
  </div>
  
  <button class="btn btn-outline" style="margin-top:30px;" onclick="openCheckout()">Перейти к оформлению 🛒</button>
</div>

<!-- МОДАЛКА ОФОРМЛЕНИЯ -->
<div class="modal-overlay" id="checkoutModal">
  <div class="modal">
    <button class="modal-close" onclick="document.getElementById('checkoutModal').classList.remove('show')">×</button>
    <h2 style="text-align: center; margin-bottom: 15px;">Оформление</h2>
    
    <div id="cartItems"></div>
    <div class="total" id="cartTotal">0 ₽</div>

    <label>Ваше ФИО *</label>
    <input type="text" id="regName" placeholder="Иван Иванов">
    
    <label>Телефон *</label>
    <input type="tel" id="regPhone" placeholder="+7 999 000-00-00">
    
    <label>Город *</label>
    <input type="text" id="regCity" placeholder="Москва">
    
    <label>Адрес (улица, дом, кв) *</label>
    <input type="text" id="regAddress" placeholder="ул. Ленина, д. 5, кв. 10">

    <button class="btn" id="submitBtn">Отправить заказ</button>
    
    <div id="successBlock" style="display:none; text-align:center; padding: 20px 0;">
      <h2 style="color: #00c853;">✅ Заказ отправлен!</h2>
      <p style="color: #aaa; margin-top: 10px;">Вернитесь в Telegram и нажмите кнопку <b>«📱 Подтвердить номер»</b>, чтобы завершить оформление.</p>
    </div>
  </div>
</div>

<script>
  let cart = [];

  function addToCart(name, price) {
    cart.push({ name, price });
    alert('Товар добавлен в корзину!');
  }

  function openCheckout() {
    if (cart.length === 0) return alert('Корзина пуста!');
    let html = '', total = 0;
    cart.forEach(item => {
      html += `<div class="cart-item"><span>${item.name}</span><span>${item.price} ₽</span></div>`;
      total += item.price;
    });
    document.getElementById('cartItems').innerHTML = html;
    document.getElementById('cartTotal').innerText = total + ' ₽';
    document.getElementById('checkoutModal').classList.add('show');
  }

  document.getElementById('submitBtn').onclick = () => {
    let name = document.getElementById('regName').value.trim();
    let phone = document.getElementById('regPhone').value.trim();
    let city = document.getElementById('regCity').value.trim();
    let address = document.getElementById('regAddress').value.trim();

    if (name.length < 2) return alert('Введите имя');
    if (phone.replace(/\D/g, '').length < 11) return alert('Введите корректный телефон');
    if (city.length < 2) return alert('Введите город');
    if (address.length < 5) return alert('Введите полный адрес');

    let total = cart.reduce((s, i) => s + i.price, 0);
    let tg = window.Telegram.WebApp;

    if (tg && tg.initData !== undefined && tg.initData !== "") {
      tg.sendData(JSON.stringify({
        type: 'order',
        name: name,
        phone: phone,
        city: city,
        address: address,
        items: cart,
        total: total
      }));
      document.getElementById('submitBtn').style.display = 'none';
      document.getElementById('successBlock').style.display = 'block';
    } else {
      alert('Вы открыли сайт не через бота! Зайдите в @kraftutokBot и нажмите "Сайт / Регистрация".');
    }
  };
</script>
</body>
</html>
